# Local dev stack for ExtractPilot
# Backend .env: DATABASE_URL=postgresql://postgres:postgres@localhost:5433/email_parser
# REDIS_URL=redis://localhost:6379
# Production attachments: ATTACHMENT_MODE=full + PADDLEOCR_API_URL (see extractpilot-backend/.env.example)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: email_parser
    ports:
      - "5433:5432"
    volumes:
      - extractpilot_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  extractpilot_pg:
